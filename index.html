<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>suzucloud</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Noto Sans JP', 'sans-serif'],
                    },
                    screens: {
                        'xs': '400px',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>

<body

    <div

        <div class="w-[110px] sm:w-[170px] h-full flex-shrink-0 flex items-center justify-center">
            <img src="https://github.com/suzucloud.png" alt="suzucloud"

        </div>

        <div class="flex-grow flex flex-col justify-between h-full py-0.5 pl-1 sm:pl-2">

            <div class="flex flex-col">
                <p
                    class="text-[9px] sm:text-xs tracking-[0.25em] text-neutral-400 font-semibold uppercase leading-none mb-1.5 sm:mb-2">
                    システムエンジニア
                </p>

                <h1 class="text-2xl sm:text-3.5xl font-extrabold tracking-[0.1em] text-neutral-800 leading-none">
                    shota
                </h1>
                <p class="text-[11px] sm:text-[14px] tracking-wide text-neutral-500 font-medium font-mono mt-1.5">
                    @suzucloud
                </p>
            </div>

            <div class="flex flex-col">
                <p
                    class="font-extrabold text-[11px] sm:text-[14px] text-neutral-700 tracking-wider mb-2 sm:mb-2.5 leading-none">
                    SNS
                </p>

                <div class="flex flex-col gap-1.5 sm:gap-2">
                    <a href="https://github.com/suzucloud" target="_blank"
                        class="flex items-center gap-2 text-[9px] sm:text-[11px] text-neutral-500 font-mono leading-none">
                        <i
                            class="fa-brands fa-github text-[11px] sm:text-[13px] w-3.5 text-center text-neutral-400/90"></i>
                        <span>github.com/suzucloud</span>
                    </a>

                    <a href="https://x.com/suzucloud" target="_blank"
                        class="flex items-center gap-2 text-[9px] sm:text-[11px] text-neutral-500 font-mono leading-none">
                        <i
                            class="fa-brands fa-x-twitter text-[11px] sm:text-[13px] w-3.5 text-center text-neutral-400/90"></i>
                        <span>x.com/suzucloud</span>
                    </a>

                    <a href="https://suzucloud.github.io"
                        class="flex items-center gap-2 text-[9px] sm:text-[11px] text-neutral-500 font-mono leading-none">
                        <i
                            class="fa-solid fa-globe text-[11px] sm:text-[13px] w-3.5 text-center text-neutral-400/90"></i>
                        <span>suzucloud.github.io</span>
                    </a>
                </div>
            </div>

        </div>

    <p class="text-[10px] text-neutral-400 mt-6 select-none font-mono">
