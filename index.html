<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>suzucloud</title>
    <style>
        body {
            background: #f4f5f7;
            font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* 名刺カード本体 */
        .card {
            width: 500px;
            background: #fff;
            border: 1px solid #ccc;
            border-left: 5px solid #1e3a8a;
            padding: 24px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 1px solid #ddd;
        }

        .right {
            flex: 1;
        }

        .company {
            font-size: 10px;
            font-weight: bold;
            color: #1e3a8a;
            letter-spacing: 1px;
        }

        .job {
            font-size: 12px;
            color: #555;
            margin-bottom: 8px;
        }

        .name {
            font-size: 22px;
            font-weight: bold;
        }

        .id {
            font-size: 12px;
            color: #777;
            margin-bottom: 12px;
        }

        /* 追加情報エリア */
        .details {
            font-size: 11px;
            color: #444;
            line-height: 1.6;
            border-top: 1px solid #eee;
            padding-top: 8px;
            margin-bottom: 12px;
        }

        /* SNSリンク */
        .links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .links a {
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>

<body>

    <div class="card">
        <img class="avatar" src="https://github.com/suzucloud.png" alt="suzucloud">

        <div class="right">
            <div class="company">某SIer</div>
            <div class="job">システムエンジニア</div>

            <div class="name">shota</div>
            <div class="id">@suzucloud</div>

            <div class="details">
                <div><b>専門分野:</b> Quantum / DevOps</div>
                <div><b>拠点:</b> 名古屋 (Nagoya, Japan)</div>
